[package]
name = "settlement"
version = "0.1.0"
description = "T+N Settlement Escrow for Institutional RWA Trades"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "settlement"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
# `init-if-needed` powers `set_mint_agent`: one instruction creates the
# per-mint Transfer Agent override or updates it in place.
anchor-lang = { version = "1.2", features = ["init-if-needed"] }
anchor-spl = "1.2"
program_governance = { path = "../../libs/program_governance" }
solana-program = "5.0"
# SDK v5 split these out of `solana-program`; the recover syscall also has a
# native fallback so `cargo test` works off-chain.
solana-keccak-hasher = "3.1"
solana-secp256k1-recover = "3.3"
