[package]
name = "maverick"
version = "0.1.0"
description = "Maverick Dynamic Distribution AMM (DDAMM) for auto-rebalancing RWA LPs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "maverick"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "1.2", features = ["init-if-needed"] }
math_core = { path = "../../libs/math_core" }
anchor-spl = "1.2"
solana-program = "5.0"
