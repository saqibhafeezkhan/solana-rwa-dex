[package]
name = "order_book"
version = "0.1.0"
description = "Limit-order book with partial fills and T+N settlement routing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "order_book"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "hooks/idl-build",
    "kyc_gate/idl-build",
]
default = []

[dependencies]
anchor-lang = { version = "1.2", features = ["init-if-needed"] }
anchor-spl = "1.2"
program_governance = { path = "../../libs/program_governance" }
solana-program = "5.0"
# The maker's proceeds can be routed through the existing session rail:
# `order_book` pays them into the hooks custody account and CPIs
# `hooks::after_swap`, which locks them in the T+N settlement escrow. The KYC
# rail gates both order creation and fills.
hooks = { path = "../hooks", features = ["cpi"] }
kyc_gate = { path = "../kyc_gate", features = ["cpi"] }
settlement = { path = "../settlement", features = ["cpi"] }
