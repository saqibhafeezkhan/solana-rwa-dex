[package]
name = "twamm"
version = "0.1.0"
description = "Time-Weighted Average Market Maker for large institutional block orders"
edition = "2021"


[lib]
crate-type = ["cdylib", "lib"]
name = "twamm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "1.2", features = ["init-if-needed"] }
math_core = { path = "../../libs/math_core" }
anchor-spl = "1.2"
spl-transfer-hook-interface = "2.1"
spl-tlv-account-resolution = "0.11"
solana-program = "5.0"
solana-keccak-hasher = "3.1"