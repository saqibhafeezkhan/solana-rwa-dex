[package]
name = "kyc_gate"
version = "0.1.0"
description = "On-Chain KYC Gatekeeper using Soulbound Attestations for DEX access"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kyc_gate"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
solana-program = "5.0"
