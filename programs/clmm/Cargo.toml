[package]
name = "clmm"
version = "0.1.0"
description = "Concentrated Liquidity Market Maker (Uniswap v3-style) for volatile RWAs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "clmm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "hooks/idl-build",
    "oracle/idl-build",
    "kyc_gate/idl-build",
]
default = []

# A `cargo test -p clmm` run covers the unit tests in `src/lib.rs`. The
# end-to-end tests need a Solana VM whose dependency stack cannot share a graph
# with this crate's `solana-program 5.0`, so they live in their own workspace:
# see `tests/e2e`.

[dependencies]
anchor-lang = { version = "1.2", features = ["init-if-needed"] }
math_core = { path = "../../libs/math_core" }
anchor-spl = "1.2"
solana-program = "5.0"
# The pool-level wiring: swap CPIs the KYC gate before trading, the oracle
# circuit breaker after pricing, and routes the output into the T+N settlement
# escrow through the hooks program. All three are optional per pool.
hooks = { path = "../hooks", features = ["cpi"] }
oracle = { path = "../oracle", features = ["cpi"] }
kyc_gate = { path = "../kyc_gate", features = ["cpi"] }