[workspace]
# `programs/*` holds deployable Anchor programs; `libs/*` holds shared crates that
# are compiled into them. Shared code must not live under `programs/`, because
# `anchor build` treats every crate there as a program and expects an IDL from it.
members = [
    "programs/*",
    "libs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
panic = "abort"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

