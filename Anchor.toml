skip_local_validator = false

[toolchain]
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

# The program addresses are identical on every cluster: the ids are baked into
# each crate's `declare_id!` and into the program keypairs under target/deploy,
# so a client's PDAs do not change with the cluster. Keep the two lists in step
# when adding a program (`anchor keys sync` only rewrites the active cluster).
# Deploying: scripts/deploy-localnet.sh and scripts/deploy-devnet.sh.
[programs.devnet]
clmm = "GKvqhzy7V6MN8YRuQchWahMJLG4cbHWdWzEWyoSG1XNU"
dlmm = "5JPnmJouZ3yE9Xwaacjtr5F2E1ShYGxJ1mR4UV9EFE3c"
hooks = "B5thQMyLNmPsgWVnsscaP4BFUMVW7QFwnufiJKq6Y1DA"
