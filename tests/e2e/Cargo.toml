[package]
name = "clmm-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end tests for the programs, run against their built SBF images"

# Deliberately a workspace of its own. These tests execute the compiled program
# inside a Solana VM, so they depend on the Solana stack that VM is built from —
# versions that cannot share one Cargo graph with the programs' own
# `solana-program 5.0`, because Cargo will not keep two semver-compatible
# versions of a crate. Nothing here is linked into, or deployed with, the
# on-chain programs; see `tests/clmm.rs` and `tests/oracle.rs`.
[workspace]

[dev-dependencies]
litesvm = "0.16"
# The settlement release test signs the same keccak256 preimage the Transfer
# Agent signs, so the suite needs secp256k1 signing and Keccak256.
k256 = "0.13"
sha3 = "0.10"
solana-account = "~4.3.0"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-hash = "~4.5.0"
solana-instruction = "~3.4.0"
solana-keypair = "~3.1.2"
solana-message = "=4.2.4"
solana-signer = "~3.0.1"
solana-transaction = "~4.1.5"
